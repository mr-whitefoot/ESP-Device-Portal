; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Тестовое окружение native собирается только через `pio test -e native`,
; поэтому обычная сборка прошивки не должна его задевать.
default_envs = esp01_relay

; Личные настройки поверх этого файла: адреса устройств для espota, прошивка
; по проводу. Файл в .gitignore, его отсутствие ошибкой не считается --
; сам по себе platformio_override.ini не подхватывается, нужен этот список.
extra_configs = platformio_override.ini

; Общая часть всех окружений ESP8266. Одна кодовая база, разные
; платы и конечные устройства:
; окружение задаёт -D DEVICE_*, а main.cpp по этому флагу подключает нужный
; каталог lib/device_*. Ядро от выбора не зависит.
[esp8266]
platform = espressif8266
framework = arduino
upload_speed = 921600
monitor_speed = 74880

; Конфигурация имени/версии нужна до загрузки builder-а, а post-action
; проверки размера должен регистрироваться после того, как платформа создала
; настоящий target .bin. Поэтому это два скрипта с разными фазами.
extra_scripts =
	pre:extra_script.py
	post:extra_script_ota.py

; Версия прошивки -- одна на все устройства, потому что ядро одно.
;
; Раньше номера были свои: реле несло линию 3.x ещё с досборочных времён,
; датчик начали с 0.1.0, чтобы номер сам говорил «новое, непроверенное». После
; переезда обоих на общее ядро это перестало работать: любая правка ядра
; поднимает версию обеим прошивкам, и номера всё равно шли в ногу
; (3.4.5/0.1.5, 3.4.6/0.1.6, 3.4.7/0.1.7) -- то есть общий номер уже
; существовал, просто носил две маски и делал вид, будто это разные кодовые
; базы разной зрелости. Объединено на 3.5.0: минорный шаг у реле отмечает саму
; смену схемы, датчик подхватывает общий номер.
;
; Цена решения: номер больше ничего не говорит о зрелости конкретного
; устройства -- что у датчика проверено, а что нет, написано словами в README.
; И правка, касающаяся одного устройства, поднимает версию обоим. Так было и
; раньше, просто теперь это видно честно.
;
; Значение подхватывается через extends и уходит в два места: -DVERSION в
; окружениях ниже и имя bin-файла в extra_script.py (GetProjectOption). Имена
; файлов не столкнутся: их различает custom_device_name. Префикс custom_
; обязателен для пользовательских опций PlatformIO и убирает warning сборки.
release_version = 4.1.0

; Общие для всех устройств флаги. Окружения дописывают к ним свои через
; ${esp8266.build_flags} -- подставлять целиком чужую строку с ${this.*} нельзя
; (см. комментарий у esp01_relay_metrics), а здесь таких подстановок нет.
;
build_flags =

lib_deps =
	; Эта пара зафиксирована совместно. bertmelis/espMqttClient@1.7.3 с
	; ESP32Async/ESPAsyncTCP@2.0.0 отменял асинхронную TCP-попытку до callback
	; на текущем ESP8266 core. Не обновлять MQTT и TCP независимо без проверки
	; недоступного брокера и повторного подключения на железе.
	me-no-dev/ESPAsyncTCP@1.2.2
	marvinroger/AsyncMqttClient@0.9.0
	bblanchon/ArduinoJson@^7.4.3
	gyverlibs/TimerMs@^1.2
	gyverlibs/GyverPortal@^3.6.6
	gyverlibs/GyverDB @ ^1.4.3

; NTPClient выброшен: его update() ждал ответ на месте до 1000 мс, и мёртвый
; сервер из пула означал секунду замершего loop() каждую минуту. Замена --
; lib/ntp_clock + lib/core/core_ntp.h, где запрос и ответ разнесены.
; Timezone и Time ушли следом: они подключались в main.cpp, но не использовались
; ни разу -- смещение пояса даёт своя таблица lib/timezone_table.

; Платы отделены от устройств. Здесь живут только разметка флеша и
; предел OTA; конечные окружения ниже выбирают тип устройства и GPIO.
[esp01]
extends = esp8266
board = esp01_1m
upload_protocol = espota
board_build.ldscript = eagle.flash.1m64.ld
; Половина области скетча 962560: новый OTA-образ должен поместиться рядом
; со старым.
custom_ota_max_size = 481280

[d1_mini]
extends = esp8266
board = d1_mini
; У D1 mini есть USB-UART, поэтому первая и восстановительная прошивки не
; требуют локального IP. Для OTA протокол переопределяется в platformio_override.ini.
upload_protocol = esptool
; Штатная разметка D1 mini: 4 МБ флеша, 1 МБ FS, OTA до 1044464 байт.
custom_ota_max_size = 1044464

; У установленного на восьмиканальной плате ESP-07S фактически 1 МБ флеша.
; Разметка 1m64 оставляет 64 КБ под LittleFS и 962560 байт под скетчи.
; Первая прошивка идёт по UART; локальный espota и адрес задаются только в
; platformio_override.ini.
[esp07s]
extends = esp8266
board = esp07s
upload_protocol = esptool
board_build.ldscript = eagle.flash.1m64.ld
; Новый OTA-образ должен поместиться рядом со старым в области скетчей.
custom_ota_max_size = 481280

; Реле на ESP-01.
[env:esp01_relay]
extends = esp01


; Версия и имя устройства попадают и в прошивку, и в имя bin-файла
; (см. extra_script.py), поэтому разъехаться не могут. Версия общая, она
; в секции [esp8266]; здесь только имя устройства.
custom_device_name = Relay

build_flags =
	${esp8266.build_flags}
	-D DEVICE_RELAY
	-D RELAY_PIN=0
	-DVERSION=${this.release_version}

; Диагностическая сборка реле: то же устройство плюс метрики loop() в serial.
; Отдельным окружением, а не флагом в esp01_relay, чтобы обычная прошивка их
; не несла и чтобы случайный `pio run` не залил на железку диагностику.
; Имя устройства своё, иначе bin-файлы двух сборок совпали бы по имени.
[env:esp01_relay_metrics]
extends = env:esp01_relay

custom_device_name = Relay_metrics

; Флаги выписаны целиком, а не через ${env:esp01_relay.build_flags}: там
; ${this.release_version}, и "this" при подстановке разрешается относительно
; той секции, куда значение подставили.
build_flags =
	${esp8266.build_flags}
	-D DEVICE_RELAY
	-D RELAY_PIN=0
	-DVERSION=${this.release_version}
	-D LOOP_METRICS

; То же реле на Wemos/LOLIN D1 mini. В терминах платы D2 -- это GPIO4.
[env:d1_mini_relay]
extends = d1_mini

custom_device_name = Relay_D1_mini

build_flags =
	${esp8266.build_flags}
	-D DEVICE_RELAY
	-D RELAY_PIN=D2
	-DVERSION=${this.release_version}

; Восьмиканальная релейная плата на ESP8266 ESP-07S. GPIO взяты из её
; существующей прошивки; явные флаги не дают случайно собрать образ с
; распиновкой другой платы.
[env:esp07s_relay8]
extends = esp07s

custom_device_name = Relay_ESP07S_8ch

build_flags =
	${esp8266.build_flags}
	-D DEVICE_RELAY_BANK
	-D RELAY1_PIN=16
	-D RELAY2_PIN=14
	-D RELAY3_PIN=12
	-D RELAY4_PIN=13
	-D RELAY5_PIN=15
	-D RELAY6_PIN=0
	-D RELAY7_PIN=4
	-D RELAY8_PIN=5
	-DVERSION=${this.release_version}

; Датчик температуры DS18B20 на ESP-01.
[env:esp01_ds18b20]
extends = esp01
; upload_port намеренно не задан в конфигурации репозитория: случайный
; `-t upload` не должен перешить рабочий датчик. Адрес указывать осознанно
; только в локальном platformio_override.ini.

custom_device_name = DS18B20

build_flags =
	${esp8266.build_flags}
	-D DEVICE_DS18B20
	-DVERSION=${this.release_version}

lib_deps =
	${esp8266.lib_deps}
	paulstoffregen/OneWire@^2.3.8
	robtillaart/DS18B20@^0.2.0

; Юнит-тесты чистой логики на хосте: pio test -e native
[env:native]
platform = native
test_framework = unity
; test/fakes подменяет Arduino.h, чтобы код с pinMode/digitalWrite собирался
; на хосте; test_filter не даёт считать саму папку с фейками тестовым набором.
build_flags =
	-std=c++17
	-I test/fakes
	-D SETTINGS_BACKEND_MEMORY   ; слой настроек в оперативке вместо GyverDB
test_filter = test_*
