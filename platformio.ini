; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Тестовое окружение native собирается только через `pio test -e native`,
; поэтому обычная сборка прошивки не должна его задевать.
default_envs = esp01_1m

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
; Показанный сборкой предел -- это объём флеша под скетч, его считает сама
; платформа из ld-скрипта. Отдельный, более жёсткий предел по возможности
; OTA проверяет extra_script.py: board_upload.maximum_size здесь бесполезен,
; платформа перетирает его своим значением.

framework = arduino
upload_port = 10.0.1.86
upload_protocol = espota
upload_speed = 921600
monitor_speed = 74880
;eagle.flash.1m64.ld
;eagle.flash.1m128.ld
board_build.ldscript = eagle.flash.1m64.ld

build_flags = -DVERSION=${this.release_version}

extra_scripts = pre:extra_script.py
release_version = 3.2.0
lib_deps = 
	plapointe6/EspMQTTClient@^1.13.3
	bblanchon/ArduinoJson@^7.4.3
	gyverlibs/TimerMs@^1.2
	gyverlibs/GyverPortal@^3.6.6
	arduino-libraries/NTPClient@^3.2.1
	jchristensen/Timezone @ ^1.2.6
	paulstoffregen/Time @ ^1.6.1
	gyverlibs/GyverDB @ ^1.4.3

; Юнит-тесты чистой логики на хосте: pio test -e native
[env:native]
platform = native
test_framework = unity
; test/fakes подменяет Arduino.h, чтобы код с pinMode/digitalWrite собирался
; на хосте; test_filter не даёт считать саму папку с фейками тестовым набором.
build_flags =
	-std=c++17
	-I test/fakes
	-D SETTINGS_BACKEND_MEMORY   ; слой настроек в оперативке вместо GyverDB
test_filter = test_*
