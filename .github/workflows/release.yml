name: Release

# Тег вида version_3.7.1 -- схема, по которой репозиторий уже помечает релизы.
# Прошивки собираются заново из состояния тега, а не берутся из артефактов CI:
# артефакт живёт 30 дней и может не пережить релиз, к которому его прикладывают.
on:
  push:
    tags:
      - 'version_*'

# gh release create пишет в репозиторий, токену по умолчанию этого мало.
# pages/id-token нужны зеркалу для страницы обновления, см. шаги в конце.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Собрать и опубликовать прошивки
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Установить PlatformIO
        run: pip install platformio

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-esp8266-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-esp8266-

      # Версия живёт в двух местах: в имени тега и в release_version, откуда её
      # берут -DVERSION и имя bin-файла. Разъехаться они могут только так:
      # тег поставлен, а release_version поднять забыли. Тогда релиз version_3.7.2
      # нёс бы файлы с именем v3.7.1 и прошивку, которая по MQTT представляется
      # старым номером. Дешевле упасть здесь.
      - name: Сверить тег с release_version
        run: |
          tag_version="${GITHUB_REF_NAME#version_}"
          ini_version=$(sed -n 's/^release_version *= *//p' platformio.ini | head -1)
          if [ "$tag_version" != "$ini_version" ]; then
            echo "Тег $GITHUB_REF_NAME обещает версию $tag_version," \
                 "а в platformio.ini release_version = $ini_version." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_ENV"

      # Только конечные образы, а не диагностическая сборка esp01_relay_metrics:
      # в релизе лежит то, что можно заливать на железо, и метрики loop() в
      # serial туда не относятся. При необходимости она собирается из CI.
      - name: Собрать прошивки
        run: pio run -e esp01_relay -e d1_mini_relay -e esp07s_relay8 -e esp01_ds18b20 -e d1_mini_ds18b20 2>&1 | tee build.log

      - name: Сложить бинарники
        run: |
          mkdir dist
          cp .pio/build/esp01_relay/*.bin .pio/build/d1_mini_relay/*.bin .pio/build/esp07s_relay8/*.bin .pio/build/esp01_ds18b20/*.bin .pio/build/d1_mini_ds18b20/*.bin dist/
          ls -l dist

      # Запас по OTA -- в тело релиза: по нему видно, сколько места осталось
      # у версии, которую потом будут заливать по воздуху.
      - name: Подготовить заметки
        run: |
          {
            echo "## Прошивки"
            echo
            echo "Файлы собраны из тега \`$GITHUB_REF_NAME\`."
            echo
            echo '```'
            grep 'OTA headroom' build.log || echo "строка OTA headroom не найдена"
            echo '```'
          } > notes.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin \
            --title "ESP-Device-Portal $version" \
            --notes-file notes.md \
            --generate-notes

      # Зеркало для страницы обновления в портале. Ассеты релиза для неё не
      # годятся: release-assets.githubusercontent.com отдаёт файл без заголовка
      # Access-Control-Allow-Origin, и fetch со страницы устройства туда
      # запрещён браузером. У GitHub Pages CORS открыт.
      #
      # Шаги идут после создания релиза намеренно: если Pages в настройках
      # репозитория не включён, упадёт зеркало, а не публикация прошивок.
      #
      # Ключ images -- это custom_device_name окружения; прошивка знает своё имя
      # из -D IMAGE_NAME и по нему находит свой файл. md5 браузером не
      # проверяется (на странице по http нет crypto.subtle), он для ручной
      # сверки и локальных утилит.
      - name: Собрать manifest.json
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          version = os.environ["version"]
          suffix = "_v%s.bin" % version
          images = {}
          for path in sorted(pathlib.Path("dist").glob("*.bin")):
              images[path.name[len("ESP_"):-len(suffix)]] = {
                  "file": path.name,
                  "size": path.stat().st_size,
                  "md5": hashlib.md5(path.read_bytes()).hexdigest(),
              }
          manifest = {"version": version, "images": images}
          pathlib.Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=1) + "\n")
          print(json.dumps(manifest, indent=1))

          # Зеркало заняло адрес, по которому раньше публиковался README, и без
          # index.html корень сайта отдавал бы 404. Страница заодно объясняет,
          # что это за файлы и что руками их качать не нужно.
          rows = "\n".join(
              '<li><a href="{f}">{f}</a> — {s} B</li>'.format(f=i["file"], s=i["size"])
              for i in images.values())
          pathlib.Path("dist/index.html").write_text(
              '<!doctype html><meta charset="utf-8">'
              "<title>ESP-Device-Portal {v}</title>"
              "<h1>ESP-Device-Portal {v}</h1>"
              "<p>Зеркало прошивок для страницы обновления в портале устройства. "
              'Обычный путь — кнопка <b>Install</b> на странице Firmware upgrade; '
              'описание в <a href="https://github.com/mr-whitefoot/ESP-Device-Portal"'
              ">репозитории</a>.</p>"
              '<ul>{rows}</ul><p><a href="manifest.json">manifest.json</a></p>\n'
              .format(v=version, rows=rows))
          PY

      # enablement переводит Pages репозитория на публикацию из Actions. Без
      # него сайт, заведённый из ветки, остаётся в режиме legacy, и deploy-pages
      # падает с отказом развернуть артефакт.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: pages_deploy
        uses: actions/deploy-pages@v4
