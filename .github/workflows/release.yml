name: Release

# Тег вида version_3.7.1 -- схема, по которой репозиторий уже помечает релизы.
# Прошивки собираются заново из состояния тега, а не берутся из артефактов CI:
# артефакт живёт 30 дней и может не пережить релиз, к которому его прикладывают.
on:
  push:
    tags:
      - 'version_*'

# gh release create пишет в репозиторий, токену по умолчанию этого мало.
# pages/id-token нужны зеркалу для страницы обновления, см. шаги в конце.
permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Форма записи образа в манифесте. С 4.7.1 -- сжатая: по воздуху уходит
  # .bin.gz, несжатый .bin остаётся в релизе и на зеркале как путь ручной
  # заливки и отката.
  #
  # Переключено после того, как 4.7.0 разошлась по парку. Порог именно такой:
  # прошивки до 4.5.1 включительно берут из манифеста file/size/md5 и отвергают
  # всё, что не кончается на .bin (`not a .bin` в core_ota.h). Начиная с 4.6.0
  # и скрипт, и приёмник образа умеют gz, поэтому 4.6.0 сжатый манифест понимает
  # без всякой доработки -- ради этого он и выпускался.
  #
  # Развести две группы одним манифестом нельзя: 4.5.1 и 4.6.0 читают одни и те
  # же три поля, и различить их нечем. Устройство на 4.5.1 после этого
  # обновляется только ручной заливкой .bin через портал -- он публикуется
  # по-прежнему.
  #
  # Совместимость в другую сторону сохраняется: новый скрипт понимает и старую
  # форму (поля `raw` нет -- ставится несжатым).
  COMPRESSED_MANIFEST: 'true'

  # Сколько релизов держать на зеркале, считая текущий. Их версии попадают в
  # выбор на странице обновления, поэтому глубина -- это ровно то, насколько
  # далеко можно откатиться кнопкой. Каждый релиз стоит около 3,3 МБ на Pages.
  # Пять шагов покрывают всю линию, где приём образа уже умеет то же, что и
  # сейчас; дальше назад откат всё равно потребовал бы UART.
  MIRROR_RELEASES: '5'

jobs:
  release:
    name: Собрать и опубликовать прошивки
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Установить PlatformIO
        run: pip install platformio

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-esp8266-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-esp8266-

      # Версия живёт в двух местах: в имени тега и в release_version, откуда её
      # берут -DVERSION и имя bin-файла. Разъехаться они могут только так:
      # тег поставлен, а release_version поднять забыли. Тогда релиз version_3.7.2
      # нёс бы файлы с именем v3.7.1 и прошивку, которая по MQTT представляется
      # старым номером. Дешевле упасть здесь.
      - name: Сверить тег с release_version
        run: |
          tag_version="${GITHUB_REF_NAME#version_}"
          ini_version=$(sed -n 's/^release_version *= *//p' platformio.ini | head -1)
          if [ "$tag_version" != "$ini_version" ]; then
            echo "Тег $GITHUB_REF_NAME обещает версию $tag_version," \
                 "а в platformio.ini release_version = $ini_version." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_ENV"

      # Секция CHANGELOG нужна и телу релиза, и полю notes в манифесте, откуда
      # её читает страница обновления устройства. Забыть её так же легко, как
      # release_version, и так же дёшево поймать здесь -- до сборки.
      - name: Проверить секцию CHANGELOG
        run: python3 tools/changelog.py "$version" > changelog.txt

      # Только конечные образы, а не диагностическая сборка esp01_relay_metrics:
      # в релизе лежит то, что можно заливать на железо, и метрики loop() в
      # serial туда не относятся. При необходимости она собирается из CI.
      - name: Собрать прошивки
        run: pio run -e esp01_relay -e d1_mini_relay -e esp07s_relay8 -e sonoff_basic_relay -e esp01_ds18b20 -e d1_mini_ds18b20 2>&1 | tee build.log

      # Вместе с .bin забираем .bin.gz: сжатые образы делает сама сборка
      # (extra_script_ota.py), а не отдельный шаг здесь -- тогда локальный
      # `pio run` даёт ровно те же файлы, что и релиз. По воздуху через портал
      # уходит именно .gz, несжатый остаётся путём ручной заливки и отката.
      - name: Сложить бинарники
        run: |
          mkdir dist
          cp .pio/build/{esp01_relay,d1_mini_relay,esp07s_relay8,sonoff_basic_relay,esp01_ds18b20,d1_mini_ds18b20}/*.bin .pio/build/{esp01_relay,d1_mini_relay,esp07s_relay8,sonoff_basic_relay,esp01_ds18b20,d1_mini_ds18b20}/*.bin.gz dist/
          ls -l dist

      # Запас по OTA -- в тело релиза: по нему видно, сколько места осталось
      # у версии, которую потом будут заливать по воздуху.
      - name: Подготовить заметки
        run: |
          {
            echo "## Что нового"
            echo
            cat changelog.txt
            echo
            echo "## Прошивки"
            echo
            echo "Файлы собраны из тега \`$GITHUB_REF_NAME\`."
            echo
            echo '```'
            grep -E 'OTA headroom|^gzip:' build.log || echo "строка OTA headroom не найдена"
            echo '```'
          } > notes.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin dist/*.bin.gz \
            --title "ESP-Device-Portal $version" \
            --notes-file notes.md \
            --generate-notes

      # Прошлые релизы на зеркало. Артефакт Pages собирается заново каждый раз и
      # заменяет сайт целиком, поэтому история не накапливается сама -- её нужно
      # принести с собой. Ассеты качаются здесь, на сервере: у
      # release-assets.githubusercontent.com нет Access-Control-Allow-Origin, и
      # из браузера они недостижимы по той же причине, по которой существует
      # само зеркало.
      #
      # Берётся только .bin: сжатую форму делаем сами и одинаково для всех
      # версий. У релизов до 4.6.0 .bin.gz в ассетах нет вовсе, а без него
      # откат на них с крупного образа был бы невозможен -- несжатая заливка
      # требует свободного места под весь образ целиком.
      - name: Принести прошлые релизы
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=$((MIRROR_RELEASES - 1))
          older=$(gh release list --limit 40 --json tagName -q '.[].tagName' \
            | grep '^version_' | sed 's/^version_//' \
            | sort -V -r | grep -v "^$version\$" | head -n "$keep" || true)
          for old in $older; do
            echo "::group::$old"
            gh release download "version_$old" -D dist -p '*.bin' || \
              echo "у version_$old нет .bin-ассетов, пропущено"
            echo '::endgroup::'
          done
          python3 - <<'PY'
          import gzip, pathlib
          for path in sorted(pathlib.Path("dist").glob("*.bin")):
              packed = path.with_name(path.name + ".gz")
              if packed.exists():
                  continue
              with open(packed, "wb") as out:
                  with gzip.GzipFile(fileobj=out, mode="wb",
                                     compresslevel=9, mtime=0) as gz:
                      gz.write(path.read_bytes())
              print("сжат %s: %d -> %d" % (path.name, path.stat().st_size,
                                           packed.stat().st_size))
          PY
          ls -l dist

      # Зеркало для страницы обновления в портале. Ассеты релиза для неё не
      # годятся: release-assets.githubusercontent.com отдаёт файл без заголовка
      # Access-Control-Allow-Origin, и fetch со страницы устройства туда
      # запрещён браузером. У GitHub Pages CORS открыт.
      #
      # Шаги идут после создания релиза намеренно: если Pages в настройках
      # репозитория не включён, упадёт зеркало, а не публикация прошивок.
      #
      # Ключ images -- это custom_device_name окружения; прошивка знает своё имя
      # из -D IMAGE_NAME и по нему находит свой файл. md5 браузером не
      # проверяется (на странице по http нет crypto.subtle), он для ручной
      # сверки и для сквозной проверки на устройстве: страница передаёт его в
      # `?md5=`, и Update сверяет принятые байты.
      #
      # Форму записи образа выбирает COMPRESSED_MANIFEST (см. env в начале файла).
      # В сжатой форме file/size/md5 описывают .bin.gz -- ровно то, что
      # передаётся и стейджится, -- а несжатый идёт полями raw*.
      #
      # history перечисляет релизы, лежащие на зеркале, свежий первым: версия,
      # текст "что нового" из CHANGELOG и свой набор образов. Из него страница
      # обновления делает выбор версии.
      #
      # Верхние version/images дублируют первую запись history и остаются ради
      # прошивок 4.3.1--4.6.0: их скрипт вшит во флеш, про history не знает и
      # читает именно эти поля. Убрать их можно будет только тогда, когда таких
      # устройств не останется.
      - name: Собрать manifest.json
        run: |
          cp web/fw.js dist/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          version = os.environ["version"]
          compressed = os.environ["COMPRESSED_MANIFEST"] == "true"
          dist = pathlib.Path("dist")

          def entry(path):
              packed = path.with_name(path.name + ".gz")
              raw = {
                  "file": path.name,
                  "size": path.stat().st_size,
                  "md5": hashlib.md5(path.read_bytes()).hexdigest(),
              }
              if not compressed:
                  return raw
              return {
                  "file": packed.name,
                  "size": packed.stat().st_size,
                  "md5": hashlib.md5(packed.read_bytes()).hexdigest(),
                  "raw": raw["size"],
                  "raw_file": raw["file"],
                  "raw_md5": raw["md5"],
              }

          # Ключ images -- это custom_device_name окружения; прошивка знает своё
          # имя из -D IMAGE_NAME и по нему находит свой файл. md5 браузером не
          # проверяется (на странице по http нет crypto.subtle), он для ручной
          # сверки и для сквозной проверки на устройстве: страница передаёт его
          # в `?md5=`, и Update сверяет принятые байты.
          def images(release):
              suffix = "_v%s.bin" % release
              return {path.name[len("ESP_"):-len(suffix)]: entry(path)
                      for path in sorted(dist.glob("ESP_*" + suffix))}

          # Набор версий берётся из имён файлов, а не из списка тегов: на
          # зеркало попадает ровно то, что скачалось, и манифест не должен
          # обещать релиз, чьи ассеты не приехали.
          found = set()
          for path in dist.glob("ESP_*.bin"):
              match = re.search(r"_v(\d+\.\d+\.\d+)\.bin$", path.name)
              if match:
                  found.add(match.group(1))
          order = sorted(found, key=lambda s: [int(x) for x in s.split(".")],
                         reverse=True)

          def notes(release):
              done = subprocess.run(["python3", "tools/changelog.py", release],
                                    capture_output=True, text=True)
              return done.stdout.strip() if done.returncode == 0 else ""

          history = [{"version": release, "notes": notes(release),
                      "images": images(release)} for release in order]
          if history[0]["version"] != version:
              raise SystemExit("свежий релиз на зеркале -- %s, а собираем %s"
                               % (history[0]["version"], version))

          print("manifest: %s, релизов %d"
                % ("сжатый" if compressed else "несжатый, фаза 1", len(history)))
          manifest = {"version": version, "images": history[0]["images"],
                      "history": history}
          pathlib.Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=1, ensure_ascii=False) + "\n")
          print(json.dumps(manifest, indent=1, ensure_ascii=False))

          # Зеркало заняло адрес, по которому раньше публиковался README, и без
          # index.html корень сайта отдавал бы 404. Страница заодно объясняет,
          # что это за файлы и что руками их качать не нужно.
          # Оба файла в списке независимо от формы манифеста: .gz лежит на
          # зеркале и в фазе 1, просто ещё никем не запрашивается.
          groups = ""
          for release in history:
              rows = "\n".join(
                  '<li><a href="{f}">{f}</a> — {s} B '
                  '(<a href="{f}.gz">{f}.gz</a>)</li>'.format(
                      f=i.get("raw_file", i["file"]), s=i.get("raw", i["size"]))
                  for i in release["images"].values())
              groups += "<h2>{v}</h2><ul>{rows}</ul>".format(
                  v=release["version"], rows=rows)
          pathlib.Path("dist/index.html").write_text(
              '<!doctype html><meta charset="utf-8">'
              "<title>ESP-Device-Portal {v}</title>"
              "<h1>ESP-Device-Portal {v}</h1>"
              "<p>Зеркало прошивок для страницы обновления в портале устройства. "
              "Руками заливается только несжатый <code>.bin</code>; "
              "<code>.bin.gz</code> ставит страница обновления сама. "
              'Обычный путь — кнопка <b>Install</b> на странице Firmware upgrade, '
              "там же выбирается версия; описание в "
              '<a href="https://github.com/mr-whitefoot/ESP-Device-Portal">'
              "репозитории</a>.</p>"
              "{groups}"
              '<p><a href="manifest.json">manifest.json</a> · '
              '<a href="fw.js">fw.js</a></p>\n'
              .format(v=version, groups=groups))
          PY

      # enablement переводит Pages репозитория на публикацию из Actions. Без
      # него сайт, заведённый из ветки, остаётся в режиме legacy, и deploy-pages
      # падает с отказом развернуть артефакт.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: pages_deploy
        uses: actions/deploy-pages@v4
